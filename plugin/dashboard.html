<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SWISS SEC</title>
    <style>
        body { font-family: sans-serif; margin: 10px; background: #121212; color: #e0e0e0; width: 450px; }
        #terminal { 
            white-space: pre-wrap; 
            height: 300px; 
            border: 1px solid #444; 
            overflow-y: auto;
            padding: 10px;
            background: #1e1e1e;
            color: #00ff00;
            font-family: monospace;
            margin-bottom: 10px;
        }
        input { width: 330px; padding: 8px; background: #222; color: #fff; border: 1px solid #444; }
        button { padding: 8px 15px; cursor: pointer; background: #333; color: #fff; border: 1px solid #555; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-bar { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>SWISS SEC</h2>
    <div class="status-bar">
        <button id="connectBtn">Connect Hardware</button>
    </div>
    <div id="terminal"></div>
    <input type="text" id="input" placeholder="Type command..." disabled>
    <button id="sendBtn" disabled>Send</button>

    <script src="dashboard.js"></script>
</body>
</html>
