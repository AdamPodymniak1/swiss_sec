; Shared defaults — PlatformIO applies this to every [env:*] section below
; unless that section overrides a key outright.
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I lib/commons
    -I lib/ML-DSA44
    -I lib/ML-DSA65
    -I lib/ML-DSA87
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    lovyan03/LovyanGFX@^1.1.16
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
    olikraus/U8g2@^2.35.4
    rweather/Crypto@^0.4.0

; ---------------------------------------------------------------------------
; RELEASE build. This is what ships. No provisioning command compiled in
; PROVISION_ATTESTATION does not exist in this binary.
; ---------------------------------------------------------------------------
; Real firmware envs must never pull in the debug-only sketches under
; src/debug/, src/debug_genkey_sign/ and src/debug_lock_config/ - each has
; its own setup()/loop() that would collide with main.cpp's at link time.
; (Per-env `src_dir` overrides turned out to be unreliable with this
; PlatformIO/LDF version - stuck on a stale full-src_dir build at least
; once - so every env below uses build_src_filter on the one shared
; default src_dir instead.)
[env:esp32s3]
build_src_filter =
    +<*>
    -<debug/>
    -<debug_genkey_sign/>
    -<debug_lock_config/>

; ---------------------------------------------------------------------------
; BENCH/DEV build. Same firmware, plus the PROVISION_ATTESTATION JSON
; command from AttestationProvisioningCmd.cpp. Use this only on your own
; test hardware, never flash an esp32s3-bench build to a device that will
; leave the bench, since it lets anyone who has (or phishes) the PIN
; rewrite the device's attestation identity over USB.
;
;   pio run -e esp32s3-bench -t upload
; ---------------------------------------------------------------------------
[env:esp32s3-bench]
build_flags =
    ${env.build_flags}
    -D ALLOW_ATTESTATION_PROVISIONING_CMD
build_src_filter =
    +<*>
    -<debug/>
    -<debug_genkey_sign/>
    -<debug_lock_config/>

; This board exposes two separate USB connections: a CH340 UART bridge
; wired to UART0 (reliable for esptool's reset-to-bootloader sequence, and
; also the port the real firmware's Serial0 debug log shows up on) and the
; ESP32-S3's own native USB (where the app's Serial.print output normally
; goes, since ARDUINO_USB_CDC_ON_BOOT=1 routes Serial there). Both debug
; envs below pin them explicitly by stable by-id path instead of the
; ttyACM0/1 names, which swap around on every reset/replug.
;
; ---------------------------------------------------------------------------
; ATECC508A/608A I2C diagnostic sketch, isolated from the real firmware via
; build_src_filter (its own setup()/loop() would otherwise collide with
; main.cpp's).
;
;   pio run -e esp32s3-atecc-debug -t upload -t monitor
; ---------------------------------------------------------------------------
[env:esp32s3-atecc-debug]
build_src_filter =
    -<*>
    +<debug/AteccDebug.cpp>
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C94135599-if00
monitor_port = /dev/serial/by-id/usb-Espressif_Systems_Espressif_ESP32-S3-DevKitC-1-N8__8_MB_QD__No_PSRAM__14C19F418D84-if00

; ---------------------------------------------------------------------------
; One-off hardware validation of AteccManager's GenKey/Sign path against
; real silicon (see src/debug_genkey_sign/AteccGenKeySignTest.cpp). Links
; the real src/AteccManager.cpp (not a reimplementation) plus this test's
; own tiny setup()/loop(), isolated from main.cpp the same way as above.
;
;   pio run -e esp32s3-atecc-genkey-sign-test -t upload -t monitor
; ---------------------------------------------------------------------------
[env:esp32s3-atecc-genkey-sign-test]
build_src_filter =
    -<*>
    +<debug_genkey_sign/AteccGenKeySignTest.cpp>
    +<AteccManager.cpp>
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C94135599-if00
monitor_port = /dev/serial/by-id/usb-Espressif_Systems_Espressif_ESP32-S3-DevKitC-1-N8__8_MB_QD__No_PSRAM__14C19F418D84-if00

; ---------------------------------------------------------------------------
; Gated tool to PERMANENTLY lock the ATECC's Config zone (see
; src/debug_lock_config/AteccLockConfig.cpp - it requires typing a
; confirmation phrase over serial before it will act; a plain upload here
; does NOT lock anything by itself).
;
;   pio run -e esp32s3-atecc-lock-config -t upload -t monitor
; ---------------------------------------------------------------------------
[env:esp32s3-atecc-lock-config]
build_src_filter =
    -<*>
    +<debug_lock_config/AteccLockConfig.cpp>
    +<AteccManager.cpp>
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C94135599-if00
monitor_port = /dev/serial/by-id/usb-Espressif_Systems_Espressif_ESP32-S3-DevKitC-1-N8__8_MB_QD__No_PSRAM__14C19F418D84-if00