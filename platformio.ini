; Shared defaults — PlatformIO applies this to every [env:*] section below
; unless that section overrides a key outright.
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I lib/commons
    -I lib/ML-DSA44
    -I lib/ML-DSA65
    -I lib/ML-DSA87
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    lovyan03/LovyanGFX@^1.1.16
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
    olikraus/U8g2@^2.35.4
    rweather/Crypto@^0.4.0

; ---------------------------------------------------------------------------
; RELEASE build. This is what ships. No provisioning command compiled in —
; PROVISION_ATTESTATION does not exist in this binary.
; ---------------------------------------------------------------------------
[env:esp32s3]

; ---------------------------------------------------------------------------
; BENCH/DEV build. Same firmware, plus the PROVISION_ATTESTATION JSON
; command from AttestationProvisioningCmd.cpp. Use this only on your own
; test hardware — never flash an esp32s3-bench build to a device that will
; leave the bench, since it lets anyone who has (or phishes) the PIN
; rewrite the device's attestation identity over USB.
;
;   pio run -e esp32s3-bench -t upload
; ---------------------------------------------------------------------------
[env:esp32s3-bench]
build_flags =
    ${env.build_flags}
    -D ALLOW_ATTESTATION_PROVISIONING_CMD