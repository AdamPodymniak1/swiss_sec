<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP32 Password Manager Test</title>
    <style>
        body { font-family: monospace; background: #121212; color: #e0e0e0; padding: 30px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border: 1px solid #333; border-radius: 6px; }
        h2 { color: #00ff00; border-bottom: 1px solid #333; padding-bottom: 8px; font-size: 1.1rem; }
        label { display: block; margin: 12px 0 4px; font-size: 0.85rem; color: #aaa; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 10px; box-sizing: border-box; background: #2a2a2a; 
            border: 1px solid #444; color: #fff; font-family: monospace; border-radius: 4px;
        }
        button {
            background: #005f9e; color: #fff; border: none; padding: 10px 15px; 
            cursor: pointer; font-family: monospace; border-radius: 4px; font-size: 0.9rem; margin-top: 15px; width: 100%;
        }
        button:hover { background: #007acc; }
        .hidden { display: none; }
        .toggle-btn { background: #444; margin-bottom: 20px; }
        .toggle-btn:hover { background: #555; }
        .verify-btn { background: #008800; }
        .verify-btn:hover { background: #00aa00; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <button id="switchBtn" class="toggle-btn">Switch to Registration</button>
        
        <div id="loginSection">
            <h2>Login Form</h2>
            <form onsubmit="event.preventDefault();">
                <label>Email</label>
                <input type="text" value="user@example.com" autocomplete="off">
                <label>Password</label>
                <input type="password" id="loginPass">
                <button id="loadBtn">Load from Cache</button>
                <button id="verifyBtn" class="verify-btn">Verify Match with Cache</button>
            </form>
        </div>

        <div id="registerSection" class="hidden">
            <h2>Registration Form</h2>
            <form onsubmit="event.preventDefault();">
                <label>Email</label>
                <input type="text" value="user@example.com" autocomplete="off">
                <label>New Password</label>
                <input type="password" id="regPass">
                <label>Confirm Password</label>
                <input type="password" id="regConfirm">
                <button id="saveBtn">Save to Cache</button>
            </form>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const loginSection = document.getElementById('loginSection');
        const registerSection = document.getElementById('registerSection');
        const switchBtn = document.getElementById('switchBtn');
        const loginPass = document.getElementById('loginPass');
        const regPass = document.getElementById('regPass');
        const regConfirm = document.getElementById('regConfirm');
        const status = document.getElementById('status');
        let isLogin = true;

        switchBtn.onclick = () => {
            isLogin = !isLogin;
            if (isLogin) {
                loginSection.classList.remove('hidden');
                registerSection.classList.add('hidden');
                switchBtn.innerText = 'Switch to Registration';
            } else {
                loginSection.classList.add('hidden');
                registerSection.classList.remove('hidden');
                switchBtn.innerText = 'Switch to Login';
            }
            status.innerText = '';
        };

        document.getElementById('saveBtn').onclick = () => {
            if (regPass.value === regConfirm.value && regPass.value !== '') {
                localStorage.setItem('esp32_pass', regPass.value);
                status.innerText = 'Password saved to cache!';
                status.style.color = '#00ff00';
            } else {
                status.innerText = 'Passwords do not match or are empty!';
                status.style.color = '#ff3333';
            }
        };

        document.getElementById('loadBtn').onclick = () => {
            const cached = localStorage.getItem('esp32_pass');
            if (cached) {
                loginPass.value = cached;
                status.innerText = 'Password loaded from cache!';
                status.style.color = '#00ff00';
            } else {
                status.innerText = 'No password in cache!';
                status.style.color = '#ffaa00';
            }
        };

        document.getElementById('verifyBtn').onclick = () => {
            const cached = localStorage.getItem('esp32_pass');
            if (!cached) {
                status.innerText = 'Nothing in cache to compare!';
                status.style.color = '#ffaa00';
                return;
            }
            if (loginPass.value === cached) {
                status.innerText = 'SUCCESS: Login password matches cache!';
                status.style.color = '#00ff00';
            } else {
                status.innerText = 'FAILED: Passwords do not match!';
                status.style.color = '#ff3333';
            }
        };
    </script>
</body>
</html>
